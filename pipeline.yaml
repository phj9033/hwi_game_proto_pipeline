# concept-pipeline — 게임 컨셉부터 프로토타입 준비까지의 7단계 파이프라인
# 단계는 데이터로 정의되고, 실행은 Claude(Claude Code)가 담당한다.
# 본 파일을 편집하면 동작이 바뀌므로 코드 변경 없이 단계 추가/수정/제거가 가능하다.

pipeline:
  name: concept-to-prototype
  version: "0.3"
  workspace_root: ./workspace
  language: ko                   # 산출물 한국어 작성
  config_ref: config.yaml
  # 백업·임시본 정책 (v0.2~)
  # 모든 백업·아카이브는 워크스페이스 루트가 아닌 .archive/ 하위에 둔다.
  # 산출물(*.md)과 백업이 한 디렉토리에 섞이지 않도록 분리.
  backup_dir: .archive            # workspace/<slug>/.archive/ 로 해석
  backup_naming:
    redo: "{step_id}-{slug}-{timestamp}/"          # /cp-redo 백업 (디렉토리)
    migration: "state-pre-migration-{timestamp}.yaml"
    manual: "{filename}.backup-{timestamp}{ext}"   # 수동 보존 시

# ─────────────────────────────────────────────────────────────────────────────
# CHANGELOG (pipeline 자체 구조 변경 이력)
# ─────────────────────────────────────────────────────────────────────────────
# 산출물 변경이 아닌 *파이프라인 구조* 변경만 기록한다.
# version bump 규칙:
#   - 단계 추가/제거/output 변경      → minor bump (0.1 → 0.2)
#   - state_schema 필드 변경            → minor bump
#   - 게이트(completion_check) 강화     → patch (0.2 → 0.2.1)
#   - 호환 ✕ 변경 (재실행 필요)         → major bump (0.x → 1.0)
changelog:
  - version: "0.3"
    date: "2026-05-06"
    changes:
      - "신규: prototype-build-loop 스킬 통합 — concept-pipeline 단계 7 이후 프로토타입 빌드·라운드 워크플로우"
      - "state_schema.required_fields 에 artifacts.engine, artifacts.build_initialized 추가"
      - "state_schema.resume_fields 에 build_state 그룹 신규 (current_round, last_snapshot, last_round_at, system_keywords)"
      - "단계 6 iteration_log.schema 에 round_variants 신규 — v0 (3 필드) + vN (5 필드) 구분"
      - "BREAKING (낮음): iteration_log.schema.round_fields 키 제거 (round_variants.vN.fields 로 대체). 외부 호출처 영향 ✕."
  - version: "0.2.1"
    date: "2026-05-01"
    changes:
      - "단계 3 게이트 강화 — sections_present_in (분기 축) + cross_reference_check ('왜 이 변주' content 검증)"
      - "단계 7 cross_reference 깊이 강화 — art-bible §E·§G.1 / tech-spec §F·§G·§I 인용 의무화"
      - "tests/pipeline_smoke.sh: 25 → 35 항목 (분기 축 + 시점 인용 깊이 추가)"
  - version: "0.2"
    date: "2026-05-01"
    changes:
      - "단계 6 outputs 3 산출물 패밀리 (SSOT + art-bible + tech-spec) 정식화"
      - "단계 7 게이트에 cross_reference_check 추가 (시점 문서 SSOT 인용 검증)"
      - "state_schema.deprecated_fields 추가 (마이그레이션 메커니즘)"
      - "pipeline.version 을 string 으로 (semver 대비)"
      - "단계 6 iteration_log 섹션 신규 — ITERATION_LOG.md 작성 규약 정식 등재 (append-only, 5 필드)"
      - "pipeline.backup_dir/.archive 정책 신규 — 백업·임시본을 워크스페이스 루트와 분리"
      - "session-start.sh 환경변수화 — CONCEPT_PIPELINE_ROOT 오버라이드 지원"
      - "단계 6 changelog_doc 섹션 신규 — 06-changelog.md 분리 (SSOT 본문 다이어트, append-only)"
      - "단계 7 게이트에 SSOT 본문 변경이력 항목 검사 추가"
      - "RAG 컬렉션 status 자동 동기화 (SKILL.md §8.1) — 부팅 시 1회 진단"
      - "tests/pipeline_smoke.sh 신규 — YAML/prompts/hooks/version/게이트 패턴 25 항목 검증"
      - "session-start.sh yq 폴백 — yq 있으면 사용, 없으면 grep 으로 자동 폴백"
      - "단계 2 분기 축 결정 근거 산출물화 — 각 드래프트에 '왜 이 변주' 필드 필수"
  - version: "0.1"
    date: "2026-04-28"
    changes:
      - "초기 7단계 정의 + state.yaml 영속성"

# ─────────────────────────────────────────────────────────────────────────────
# state.yaml 스키마 정의
# ─────────────────────────────────────────────────────────────────────────────
# 각 프로젝트의 workspace/<slug>/state.yaml 은 다음 구조를 따른다.
# 스킬(concept-pipeline)이 매 단계 실행 후 즉시 갱신한다.
state_schema:
  required_fields:
    project: string                  # 프로젝트 슬러그
    created: ISO 8601 datetime
    pipeline_version: string         # pipeline.yaml 의 version 과 매칭
    current_step: integer            # 1~7 (8 = 완료)
    completed_steps: array           # [{id, slug, completed_at, output_files}]
    artifacts: object                # concept, drafts[], selected_branch, eval_scores, detailed_gdd, integrated_spec, art_bible, tech_spec, changelog,
                                     # engine (string|null — 'godot'/'unity'/null), build_initialized (boolean — Round 0 완료 여부, 기본 false)
    notes: array                     # 중요 이벤트 로그

  resume_fields:
    sub_progress:                    # 단계 내부 진행도 (재개에 필수)
      section: string | null         # 현재 작성 중인 섹션명 (단계 1·5·6)
      last_section_completed: string | null
      step_5_section: integer | null # 5단계 9섹션 중 N번째
      step_6_section: integer | null # 6단계 9섹션 중 N번째
    last_pause_reason: string | null # 멈춤 사유 (사용자에게 표시)
    last_pause_at: ISO 8601 | null
    last_user_response_at: ISO 8601 | null
    build_state:                       # 프로토타입 빌드 라운드 상태 (v0.3~)
      current_round: integer | null    # 마지막 완료 라운드 (정수)
      last_snapshot: string | null     # 마지막 git tag (또는 null)
      last_round_at: ISO 8601 | null
      system_keywords: array | null    # SSOT §C·§B 추출 캐시

  # ───────────────────────────────────────────────────────────────────────────
  # 마이그레이션 메커니즘 (v0.2~)
  # ───────────────────────────────────────────────────────────────────────────
  # 스킬은 state.yaml 로드 시 pipeline_version 비교 + deprecated_fields 정리.
  # 규약:
  #   1. 기존 키는 *in-place 갱신*. 같은 키를 새 값으로 추가 작성 ✕ (중복 키 방지).
  #   2. 신규 키만 append. 알 수 없는 기존 키는 보존(미래 호환).
  #   3. state.yaml.pipeline_version != pipeline.yaml.version → 자동 마이그레이션 시도.
  #      - deprecated_fields 의 모든 키 제거.
  #      - 누락된 required_fields/resume_fields 기본값 추가.
  #      - notes 에 "schema migration X.Y → Z.W" 1줄 기록.
  #      - pipeline_version 갱신.
  #   4. 마이그레이션 실패 시 .archive/state-pre-migration-<timestamp>.yaml 백업 후 사용자에게 보고.
  deprecated_fields:                 # 제거 대상 (마이그레이션 시 정리)
    - path: "artifacts.coordinates"  # v17 좌표 폐기 (sail-and-cast 이력)
      since_version: "0.2"
      reason: "v17 라운드에서 좌표 시스템 폐기"
    # 향후 폐기되는 필드를 여기에 append. 제거 ✕ (기록 보존).

  example: |
    project: my-game
    created: 2026-04-28T16:00:00
    pipeline_version: "0.2"
    current_step: 5
    sub_progress:
      section: "시스템 인벤토리"
      last_section_completed: "코어 루프"
      step_5_section: 3
      step_6_section: null
    completed_steps:
      - { id: 1, slug: concept, completed_at: "...", output_files: ["01-concept.md"] }
      - { id: 2, slug: draft-3-branches, completed_at: "...", output_files: ["02-draft-A.md","02-draft-B.md","02-draft-C.md"] }
      - { id: 3, slug: save, completed_at: "...", output_files: [] }
      - { id: 4, slug: evaluate-5axis, completed_at: "...", output_files: ["04-eval-report.md"] }
    artifacts:
      concept: "01-concept.md"
      drafts: ["02-draft-A.md","02-draft-B.md","02-draft-C.md"]
      selected_branch: "A"
      eval_scores: { A: 3.65, B: 3.45, C: 3.55 }
      detailed_gdd: null
      integrated_spec: null
      art_bible: null
      tech_spec: null
      changelog: null
      engine: null
      build_initialized: false
    last_pause_reason: "단계 5 - 시스템 인벤토리 섹션 응답 대기"
    last_pause_at: "2026-04-28T16:35:00"
    last_user_response_at: "2026-04-28T16:30:00"
    notes:
      - "2026-04-28T16:00: 신규 프로젝트 시작"
      - "2026-04-28T16:25: 단계 4 평가 완료, 분기 A 선택"

# ─────────────────────────────────────────────────────────────────────────────
# 단계 정의
# ─────────────────────────────────────────────────────────────────────────────
# mode 종류:
#   conversation   - 사용자와 대화하며 점진적으로 산출물 작성 (Claude 주도 질문)
#   ai_generation  - 입력 + RAG + 프롬프트로 AI가 산출물 생성 (사용자 개입 최소)
#   ai_evaluation  - 입력을 채점/분석하여 보고서 생성 (RAG로 채점 근거 회수)
#   gate           - 파일/조건 검증만 (실제 작업 없음)

steps:
  - id: 1
    slug: concept
    name: 게임 컨셉 정립
    mode: conversation
    inputs: []
    outputs:
      - "01-concept.md"
    rag_queries: []                # 1단계는 RAG 미사용 (사용자 의도가 우선)
    prompt: prompts/01-concept.md
    required_sections:
      - 엘리베이터_피치
      - 핵심_판타지
      - 게임_기둥_3개
      - 코어_루프
      - 타겟_오디언스
      - USP

  - id: 2
    slug: draft-3-branches
    name: 3개 메카닉·장르 분기 초안 생성
    mode: ai_generation
    inputs:
      - "01-concept.md"
    outputs:
      - "02-draft-A.md"
      - "02-draft-B.md"
      - "02-draft-C.md"
    rag_queries:
      - collection: gdd-wisdom
        query: "system layering pillar core loop mechanic genre"
        optional: true            # 컬렉션 없으면 스킵
      - collection: architecture-patterns
        query: "system interface contract dependency"
        optional: true
    prompt: prompts/02-draft.md
    branch_axis: mechanic_genre   # 동일 컨셉, 다른 메카닉/장르
    branch_count: 3
    draft_depth: thin             # 컨셉 + 코어 루프 + 시스템 3~5개

  - id: 3
    slug: save
    name: 초안 저장 검증
    mode: gate
    completion_check:
      all_files_exist:
        - "02-draft-A.md"
        - "02-draft-B.md"
        - "02-draft-C.md"
      sections_present_in:
        - file: "02-draft-A.md"
          required_sections: ["분기 축"]
        - file: "02-draft-B.md"
          required_sections: ["분기 축"]
        - file: "02-draft-C.md"
          required_sections: ["분기 축"]
      # content 게이트 (v0.2~) — 분기 축 결정의 *왜* 가 휘발되지 않게.
      # 각 드래프트가 "왜 이 변주를 선택했나" 항목을 가져야 함.
      cross_reference_check:
        - file: "02-draft-A.md"
          must_contain_pattern: "왜 이 변주"
          min_count: 1
          fail_message: "02-draft-A.md 에 '왜 이 변주를 선택했나' 필드 누락. prompts/02-draft.md 의 §분기 축 형식 준수 필요."
        - file: "02-draft-B.md"
          must_contain_pattern: "왜 이 변주"
          min_count: 1
          fail_message: "02-draft-B.md 에 '왜 이 변주를 선택했나' 필드 누락."
        - file: "02-draft-C.md"
          must_contain_pattern: "왜 이 변주"
          min_count: 1
          fail_message: "02-draft-C.md 에 '왜 이 변주를 선택했나' 필드 누락."

  - id: 4
    slug: evaluate-5axis
    name: 5-Axis 평가 + 점수화
    mode: ai_evaluation
    inputs:
      - "02-draft-A.md"
      - "02-draft-B.md"
      - "02-draft-C.md"
    outputs:
      - "04-eval-report.md"
    rag_queries:
      - collection: gdd-evaluation
        per_axis: true           # axis A~E 각각 별도 회수
        query_template: "axis {axis} evaluation criteria scoring rubric"
        required: true           # gdd-evaluation은 필수 (이미 등록됨)
    rubric_ref: config.yaml      # config.yaml#rubric 의 가중치/컷오프 사용
    prompt: prompts/04-eval.md
    output_format:
      - 드래프트별_5축_점수표
      - 드래프트별_종합_점수
      - 컷오프_통과_여부
      - 사용자_권장_선택

  - id: 5
    slug: expand
    name: 선택 드래프트 상세 확장
    mode: conversation
    inputs:
      - "02-draft-{selected}.md"
      - "04-eval-report.md"
    outputs:
      - "05-detailed-gdd.md"
    rag_queries:
      - collection: gdd-evaluation
        query: "core loop design flow MDA cognitive load"
        optional: true
      - collection: gdd-wisdom
        query: "8 section GDD standard system layering game feel antipattern"
        optional: true
      - collection: architecture-patterns
        query: "system interface contract test evidence"
        optional: true
    prompt: prompts/05-expand.md
    expand_focus:                 # 4단계 점수에서 약점 축을 우선 보강
      - 약점_축_보강
      - 시스템_세부화_5_to_10
      - 공식_엣지케이스_명문화

  - id: 6
    slug: integrated-spec
    name: 디자인·개발 통합 명세서 (3 산출물 패밀리)
    mode: conversation
    inputs:
      - "05-detailed-gdd.md"
    outputs:
      - "06-integrated-spec.md"   # SSOT — 단일 진실 원본 (모든 룰·결정·부록 X 변경이력)
      - "06-art-bible.md"          # 아트 시점 — §E·§G.1 인용 + 슬롯·프롬프트·치수
      - "06-tech-spec.md"          # 개발 시점 — §F·§G·§H 인용 + 모듈·코드 매핑·테스트
    rag_queries:
      - collection: gdd-evaluation
        query: "vertical slice scope MDA system architecture"
        optional: true
      - collection: architecture-patterns
        query: "ADR control manifest TR-ID test evidence matrix system interface"
        optional: true
      - collection: gdd-wisdom
        query: "8 section GDD pillar layering bidirectional dependency"
        optional: true
    prompts:
      ssot: prompts/06-spec.md             # SSOT 작성 (기존)
      art_bible: prompts/06b-art-bible.md  # 아트 시점 (신규, SSOT 작성 후 자동 호출)
      tech_spec: prompts/06c-tech-spec.md  # 개발 시점 (신규, SSOT 작성 후 자동 호출)
    spec_sections:
      - "A. 게임_정체성"
      - "B. 코어_메카닉"
      - "C. 시스템_인벤토리"
      - "D. UX_흐름"
      - "E. 비주얼_오디오_톤"
      - "F. 아키텍처_지도"
      - "G. 데이터_스키마"
      - "H. 프로토타입_가설"
      - "I. 인수_기준"
    family_principle: |
      SSOT 단일 진실. 시점 문서는 *인용·확장* 만, *복제 ✕*.
      룰 변경은 06-integrated-spec.md 한 곳만 수정 → drift 차단.
      변경 이력은 별도 06-changelog.md 에 *append-only* 로 자라남 (SSOT 본문은 현재 진실만).

    # ─────────────────────────────────────────────────────────────────────
    # 부속 산출물: 06-changelog.md (v0.2~ SSOT 분리)
    # ─────────────────────────────────────────────────────────────────────
    # SSOT 본문(06-integrated-spec.md) 은 *현재 진실*만 담고,
    # 변경 이력은 본 파일에 *append-only* 로 자라남.
    # SSOT 의 부록 X 는 "→ 06-changelog.md 참조" 1줄 안내로만 남기고 본문 ✕.
    # 단계 6 *최초 작성 시점*엔 비어있을 수 있음 → 단계 7 게이트 검증 ✕.
    changelog_doc:
      filename: "06-changelog.md"
      mode: "append-only"
      trigger: "SSOT 룰·시스템·AC·EC 가 변경될 때마다"
      schema:
        entry_header: "- {YYYY-MM-DD} v{N.N} — {요약}"
        entry_body: "들여쓰기 후 변경 항목 bullet (어느 섹션·어느 룰·왜)"
      cross_reference:
        - "SSOT 본문에서 부록 X 는 → 06-changelog.md 인용 1줄로만 남김"

    # ─────────────────────────────────────────────────────────────────────
    # 부속 산출물: ITERATION_LOG.md (v0.2~ 정식 등재)
    # ─────────────────────────────────────────────────────────────────────
    # 단계 6 *완료 시점*엔 존재하지 않아도 OK (단계 7 게이트 검증 ✕).
    # 단계 6 이후 *프로토타입 빌드 후속 워크플로우* 가 라운드별로 append.
    # 본 파이프라인이 정의하는 것은 *작성 규약·스키마* 만 — 자라나는 시점은 후속 책임.
    # 06-tech-spec.md / 06b-art-bible.md 가 본 파일을 정식 입력으로 사용.
    iteration_log:
      filename: "ITERATION_LOG.md"
      mode: "append-only"            # 라운드는 추가만, 기존 라운드 수정 ✕
      trigger: "프로토타입 빌드 라운드 종료 시 (사용자 피드백 → 변경 → 결과 1 사이클 완료)"
      schema:
        round_header: "## v{N} — {라운드명} ({YYYY-MM-DD})"
        # round_fields 는 v0.3 에서 round_variants 로 대체됨 (라운드 종류별 다른 필드 셋).
        round_variants:                # v0.3~ : 라운드 종류별 필드 셋
          v0:                          # Round 0 — 초기 환경 (prototype-build-loop)
            description: "build/{engine}/ 스캐폴드 직후 1회. AI 수정 라운드 ✕."
            fields:
              - "**엔진**: 선택된 엔진 + 버전"
              - "**세팅**: tech-spec §F·§G·§I 어느 만큼 스캐폴드되었나"
              - "**시드 컨텐츠**: 코어 루프 1 사이클 placeholder 동작 범위"
          vN:                          # Round N ≥ 1 — AI 수정 라운드
            description: "사용자 피드백·요청 → AI 패치 → 적용 1 사이클 종료 시"
            fields:
              - "**구성**: 이번 라운드의 빌드 구성 / 메인 변화"
              - "**사용자 피드백**: 인용 형태로 *원문 그대로*"
              - "**진단**: 피드백 → 원인 추적 (1~3줄)"
              - "**변경**: 코드/명세 변경 항목 (bullet)"
              - "**결과**: 변경 후 측정·관찰 (다음 라운드 트리거)"
        cross_reference:
          - "변경이 SSOT 룰을 건드리면 → 06-integrated-spec.md 부록 X 에도 1줄 등재"
          - "변경이 신규 시그널/모듈 도입이면 → 06-tech-spec.md 의 시그널 카탈로그 갱신"
          - "변경이 신규 에셋 슬롯이면 → 06-art-bible.md 슬롯 맵 갱신"
      naming_rule: "라운드 N 은 정수 단조 증가. v3.1 같은 patch bump 는 같은 사이클 내 보강에만"

  - id: 7
    slug: ready
    name: 프로토타입 준비 완료
    mode: gate
    completion_check:
      all_files_exist:
        - "06-integrated-spec.md"
        - "06-art-bible.md"
        - "06-tech-spec.md"
      sections_present_in:
        - file: "06-integrated-spec.md"
          required_sections:
            - "A. 게임_정체성"
            - "H. 프로토타입_가설"
            - "I. 인수_기준"
        - file: "06-art-bible.md"
          required_sections:
            - "팔레트_레퍼런스"
            - "에셋_슬롯_맵"
            - "프롬프트_템플릿"
        - file: "06-tech-spec.md"
          required_sections:
            - "모듈_매핑"
            - "데이터_플로우"
            - "테스트_매트릭스"
      # ─────────────────────────────────────────────────────────────────────
      # cross_reference_check (v0.2~)
      # SSOT 단일 진실 원칙 검증 — 시점 문서가 룰을 *복제* 했는지, *인용* 했는지.
      # 인용 패턴이 N회 이상 등장해야 통과. (아래 패턴은 grep -c 로 검증)
      # ─────────────────────────────────────────────────────────────────────
      cross_reference_check:
        - file: "06-art-bible.md"
          must_contain_pattern: "06-integrated-spec\\.md"   # SSOT 인용 링크
          min_count: 3
          fail_message: "art-bible 이 SSOT 인용 ✕. §E 룰을 복제했을 가능성. SSOT(06-integrated-spec.md) 의 §E·§G.1 을 인용 링크 형태로 참조하도록 재작성 필요."
        - file: "06-tech-spec.md"
          must_contain_pattern: "06-integrated-spec\\.md"
          min_count: 3
          fail_message: "tech-spec 이 SSOT 인용 ✕. §F·§G·§I 룰을 복제했을 가능성. SSOT 인용 링크 형태로 재작성 필요."
        # 깊이 검증 (v0.2.1~) — *어느 섹션을* 인용하는지까지 본다.
        # art-bible 은 §E (비주얼·오디오 톤) + §G.1 (어종 서사) 가 자연스러운 인용처.
        - file: "06-art-bible.md"
          must_contain_pattern: "§E"
          min_count: 1
          fail_message: "art-bible 이 §E (비주얼·오디오 톤) 인용 ✕. 팔레트·톤 키워드는 §E 기반이어야 함."
        - file: "06-art-bible.md"
          must_contain_pattern: "§G\\.1|§G[ .]"
          min_count: 1
          fail_message: "art-bible 이 §G.1 (어종 서사) 또는 §G 인용 ✕. 어종 슬롯 정의는 §G 기반이어야 함."
        # tech-spec 은 §F (아키텍처) + §G (데이터 스키마) + §I (AC) 가 자연스러운 인용처.
        # §H (가설) 는 측정 결과지 모듈 매핑이 아니므로 의무 ✕.
        - file: "06-tech-spec.md"
          must_contain_pattern: "§F"
          min_count: 1
          fail_message: "tech-spec 이 §F (아키텍처 지도) 인용 ✕. 모듈 매핑은 §F 기반이어야 함."
        - file: "06-tech-spec.md"
          must_contain_pattern: "§G"
          min_count: 1
          fail_message: "tech-spec 이 §G (데이터 스키마) 인용 ✕. 시그널·Resource 매핑은 §G 기반이어야 함."
        - file: "06-tech-spec.md"
          must_contain_pattern: "§I"
          min_count: 1
          fail_message: "tech-spec 이 §I (인수 기준) 인용 ✕. 테스트 매트릭스는 §I 기반이어야 함."
        # 시점 문서가 *변경 이력* 을 복제했는지 검증 (06-changelog.md 단일 진실)
        - file: "06-art-bible.md"
          must_not_contain_pattern: "^## 부록 X|^## 변경 이력|^### 변경 이력"
          fail_message: "art-bible 에 변경 이력이 복제됨. 06-changelog.md 에만 박혀야 함."
        - file: "06-tech-spec.md"
          must_not_contain_pattern: "^## 부록 X|^## 변경 이력|^### 변경 이력"
          fail_message: "tech-spec 에 변경 이력이 복제됨. 06-changelog.md 에만 박혀야 함."
        # SSOT 본문에 변경 이력 *큰 본문* 이 박히지 않았는지 약한 검증 (1줄 인용 안내는 OK)
        # SSOT 가 본문 200줄 이상 변경 이력을 머금으면 "Date v..." 형식 항목이 보통 5+ 회 등장 → 5 이상이면 분리 권장
        - file: "06-integrated-spec.md"
          must_not_contain_pattern: "^- 20[0-9]{2}-[0-9]{2}-[0-9]{2} v[0-9]"
          fail_message: "SSOT 본문에 변경 이력 항목이 박힘. 06-changelog.md 로 분리 필요 (v0.2~ 정책)."
