# concept-pipeline — 게임 컨셉부터 프로토타입 준비까지의 7단계 파이프라인
# 단계는 데이터로 정의되고, 실행은 Claude(Claude Code)가 담당한다.
# 본 파일을 편집하면 동작이 바뀌므로 코드 변경 없이 단계 추가/수정/제거가 가능하다.

pipeline:
  name: concept-to-prototype
  version: 0.1
  workspace_root: ./workspace
  language: ko                   # 산출물 한국어 작성
  config_ref: config.yaml

# ─────────────────────────────────────────────────────────────────────────────
# state.yaml 스키마 정의
# ─────────────────────────────────────────────────────────────────────────────
# 각 프로젝트의 workspace/<slug>/state.yaml 은 다음 구조를 따른다.
# 스킬(concept-pipeline)이 매 단계 실행 후 즉시 갱신한다.
state_schema:
  required_fields:
    project: string                  # 프로젝트 슬러그
    created: ISO 8601 datetime
    pipeline_version: string         # pipeline.yaml 의 version 과 매칭
    current_step: integer            # 1~7
    completed_steps: array           # [{id, slug, completed_at, output_files}]
    artifacts: object                # concept, drafts[], selected_branch, eval_scores, detailed_gdd, integrated_spec
    notes: array                     # 중요 이벤트 로그

  resume_fields:
    sub_progress:                    # 단계 내부 진행도 (재개에 필수)
      section: string | null         # 현재 작성 중인 섹션명 (단계 1·5·6)
      last_section_completed: string | null
      step_5_section: integer | null # 5단계 9섹션 중 N번째
      step_6_section: integer | null # 6단계 9섹션 중 N번째
    last_pause_reason: string | null # 멈춤 사유 (사용자에게 표시)
    last_pause_at: ISO 8601 | null
    last_user_response_at: ISO 8601 | null

  example: |
    project: my-game
    created: 2026-04-28T16:00:00
    pipeline_version: "0.1"
    current_step: 5
    sub_progress:
      section: "시스템 인벤토리"
      last_section_completed: "코어 루프"
      step_5_section: 3
    completed_steps:
      - { id: 1, slug: concept, completed_at: "...", output_files: ["01-concept.md"] }
      - { id: 2, slug: draft-3-branches, completed_at: "...", output_files: ["02-draft-A.md","02-draft-B.md","02-draft-C.md"] }
      - { id: 3, slug: save, completed_at: "...", output_files: [] }
      - { id: 4, slug: evaluate-5axis, completed_at: "...", output_files: ["04-eval-report.md"] }
    artifacts:
      concept: "01-concept.md"
      drafts: ["02-draft-A.md","02-draft-B.md","02-draft-C.md"]
      selected_branch: "A"
      eval_scores: { A: 3.65, B: 3.45, C: 3.55 }
      detailed_gdd: null
      integrated_spec: null
    last_pause_reason: "단계 5 - 시스템 인벤토리 섹션 응답 대기"
    last_pause_at: "2026-04-28T16:35:00"
    last_user_response_at: "2026-04-28T16:30:00"
    notes:
      - "2026-04-28T16:00: 신규 프로젝트 시작"
      - "2026-04-28T16:25: 단계 4 평가 완료, 분기 A 선택"

# ─────────────────────────────────────────────────────────────────────────────
# 단계 정의
# ─────────────────────────────────────────────────────────────────────────────
# mode 종류:
#   conversation   - 사용자와 대화하며 점진적으로 산출물 작성 (Claude 주도 질문)
#   ai_generation  - 입력 + RAG + 프롬프트로 AI가 산출물 생성 (사용자 개입 최소)
#   ai_evaluation  - 입력을 채점/분석하여 보고서 생성 (RAG로 채점 근거 회수)
#   gate           - 파일/조건 검증만 (실제 작업 없음)

steps:
  - id: 1
    slug: concept
    name: 게임 컨셉 정립
    mode: conversation
    inputs: []
    outputs:
      - "01-concept.md"
    rag_queries: []                # 1단계는 RAG 미사용 (사용자 의도가 우선)
    prompt: prompts/01-concept.md
    required_sections:
      - 엘리베이터_피치
      - 핵심_판타지
      - 게임_기둥_3개
      - 코어_루프
      - 타겟_오디언스
      - USP

  - id: 2
    slug: draft-3-branches
    name: 3개 메카닉·장르 분기 초안 생성
    mode: ai_generation
    inputs:
      - "01-concept.md"
    outputs:
      - "02-draft-A.md"
      - "02-draft-B.md"
      - "02-draft-C.md"
    rag_queries:
      - collection: gdd-wisdom
        query: "system layering pillar core loop mechanic genre"
        optional: true            # 컬렉션 없으면 스킵
      - collection: architecture-patterns
        query: "system interface contract dependency"
        optional: true
    prompt: prompts/02-draft.md
    branch_axis: mechanic_genre   # 동일 컨셉, 다른 메카닉/장르
    branch_count: 3
    draft_depth: thin             # 컨셉 + 코어 루프 + 시스템 3~5개

  - id: 3
    slug: save
    name: 초안 저장 검증
    mode: gate
    completion_check:
      all_files_exist:
        - "02-draft-A.md"
        - "02-draft-B.md"
        - "02-draft-C.md"

  - id: 4
    slug: evaluate-5axis
    name: 5-Axis 평가 + 점수화
    mode: ai_evaluation
    inputs:
      - "02-draft-A.md"
      - "02-draft-B.md"
      - "02-draft-C.md"
    outputs:
      - "04-eval-report.md"
    rag_queries:
      - collection: gdd-evaluation
        per_axis: true           # axis A~E 각각 별도 회수
        query_template: "axis {axis} evaluation criteria scoring rubric"
        required: true           # gdd-evaluation은 필수 (이미 등록됨)
    rubric_ref: config.yaml      # config.yaml#rubric 의 가중치/컷오프 사용
    prompt: prompts/04-eval.md
    output_format:
      - 드래프트별_5축_점수표
      - 드래프트별_종합_점수
      - 컷오프_통과_여부
      - 사용자_권장_선택

  - id: 5
    slug: expand
    name: 선택 드래프트 상세 확장
    mode: conversation
    inputs:
      - "02-draft-{selected}.md"
      - "04-eval-report.md"
    outputs:
      - "05-detailed-gdd.md"
    rag_queries:
      - collection: gdd-evaluation
        query: "core loop design flow MDA cognitive load"
        optional: true
      - collection: gdd-wisdom
        query: "8 section GDD standard system layering game feel antipattern"
        optional: true
      - collection: architecture-patterns
        query: "system interface contract test evidence"
        optional: true
    prompt: prompts/05-expand.md
    expand_focus:                 # 4단계 점수에서 약점 축을 우선 보강
      - 약점_축_보강
      - 시스템_세부화_5_to_10
      - 공식_엣지케이스_명문화

  - id: 6
    slug: integrated-spec
    name: 디자인·개발 통합 명세서 (3 산출물 패밀리)
    mode: conversation
    inputs:
      - "05-detailed-gdd.md"
    outputs:
      - "06-integrated-spec.md"   # SSOT — 단일 진실 원본 (모든 룰·결정·부록 X 변경이력)
      - "06-art-bible.md"          # 아트 시점 — §E·§G.1 인용 + 슬롯·프롬프트·치수
      - "06-tech-spec.md"          # 개발 시점 — §F·§G·§H 인용 + 모듈·코드 매핑·테스트
    rag_queries:
      - collection: gdd-evaluation
        query: "vertical slice scope MDA system architecture"
        optional: true
      - collection: architecture-patterns
        query: "ADR control manifest TR-ID test evidence matrix system interface"
        optional: true
      - collection: gdd-wisdom
        query: "8 section GDD pillar layering bidirectional dependency"
        optional: true
    prompts:
      ssot: prompts/06-spec.md             # SSOT 작성 (기존)
      art_bible: prompts/06b-art-bible.md  # 아트 시점 (신규, SSOT 작성 후 자동 호출)
      tech_spec: prompts/06c-tech-spec.md  # 개발 시점 (신규, SSOT 작성 후 자동 호출)
    spec_sections:
      - "A. 게임_정체성"
      - "B. 코어_메카닉"
      - "C. 시스템_인벤토리"
      - "D. UX_흐름"
      - "E. 비주얼_오디오_톤"
      - "F. 아키텍처_지도"
      - "G. 데이터_스키마"
      - "H. 프로토타입_가설"
      - "I. 인수_기준"
    family_principle: |
      SSOT 단일 진실. 시점 문서는 *인용·확장* 만, *복제 ✕*.
      룰 변경은 06-integrated-spec.md 한 곳만 수정 → drift 차단.
      부록 X 변경 이력은 SSOT 에만 박혀 단일 타임라인 유지.

  - id: 7
    slug: ready
    name: 프로토타입 준비 완료
    mode: gate
    completion_check:
      all_files_exist:
        - "06-integrated-spec.md"
        - "06-art-bible.md"
        - "06-tech-spec.md"
      sections_present_in:
        - file: "06-integrated-spec.md"
          required_sections:
            - "A. 게임_정체성"
            - "H. 프로토타입_가설"
            - "I. 인수_기준"
        - file: "06-art-bible.md"
          required_sections:
            - "팔레트_레퍼런스"
            - "에셋_슬롯_맵"
            - "프롬프트_템플릿"
        - file: "06-tech-spec.md"
          required_sections:
            - "모듈_매핑"
            - "데이터_플로우"
            - "테스트_매트릭스"
    on_complete:
      message: |
        프로토타입 준비 완료. 다음 단계는 별도 워크플로우로 관리.
        산출물 패밀리:
          - workspace/{project}/06-integrated-spec.md  (SSOT)
          - workspace/{project}/06-art-bible.md        (아트 시점)
          - workspace/{project}/06-tech-spec.md        (개발 시점)
